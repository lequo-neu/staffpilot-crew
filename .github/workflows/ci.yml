name: CI

# Runs only when started by hand from the Actions tab, so pushes use no Actions minutes.
# To run it on every push again, add under `on:`
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      STAFFPILOT_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest
